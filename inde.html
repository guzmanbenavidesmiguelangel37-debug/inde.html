<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎮 Miguel Gamer 🎮</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle, #25255c 1px, transparent 1px),
                linear-gradient(135deg, #050518, #10104a, #19002e);

            background-size: 25px 25px;
        }

        /* TARJETA */

        .perfil {
            width: 320px;
            padding: 30px;
            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 20, 70, 0.95),
                    rgba(35, 5, 60, 0.95)
                );

            border-radius: 25px;

            border: 3px solid #00eaff;

            box-shadow:
                0 0 15px #00eaff,
                0 0 35px #7b00ff,
                inset 0 0 20px rgba(0, 234, 255, 0.15);
        }

        /* DECORACIÓN */

        .decoracion {
            font-size: 28px;
            margin-bottom: 15px;
        }

        /* FOTO */

        #avatar {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 20px;

            border: 4px solid #00eaff;

            box-shadow:
                0 0 15px #00eaff,
                0 0 30px #7b00ff;
        }

        /* NOMBRE */

        h1 {
            color: #00eaff;
            font-size: 32px;
            margin-bottom: 10px;

            text-shadow:
                0 0 5px #00eaff,
                0 0 15px #7b00ff;
        }

        /* FRASE */

        p {
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            line-height: 1.6;
        }

        /* BOTONES */

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .boton-enlace {
            padding: 14px;

            text-decoration: none;

            color: white;

            background: linear-gradient(
                90deg,
                #7b00ff,
                #00eaff
            );

            border-radius: 12px;

            font-weight: bold;

            border: 2px solid #00eaff;

            box-shadow:
                0 0 10px #00eaff;

            transition: 0.3s;
        }

        .boton-enlace:hover {
            transform: scale(1.07);

            box-shadow:
                0 0 20px #00eaff,
                0 0 30px #7b00ff;
        }

        /* MENSAJE */

        .mensaje {
            margin-top: 25px;

            padding: 15px;

            border-radius: 15px;

            background: rgba(0, 234, 255, 0.08);

            color: #ffffff;

            font-weight: bold;

            line-height: 1.7;

            border: 2px solid #7b00ff;

            box-shadow: 0 0 10px #7b00ff;
        }

        /* ICONOS GAMER */

        .corazones {
            font-size: 25px;
            margin-top: 20px;

            animation: gamer 1.5s infinite;
        }

        @keyframes gamer {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }

        }

    </style>

</head>

<body>

    <main class="perfil">

        <!-- DECORACIÓN -->

        <div class="decoracion">
            🎮 ⚡ 👾 🕹️ ⭐
        </div>

        <!-- FOTO -->

        <img
            id="avatar"
            src="Guzman.jpeg"
            alt="Foto de Miguel"
            title="Perfil de Miguel"
        >

        <!-- NOMBRE -->

        <h1>
            🎮 MIGUEL 🎮
        </h1>

        <!-- FRASE -->

        <p>
            ⚡ Nivel: Experto ⚡
            <br>
            🎯 Siempre listo para jugar
        </p>

        <!-- BOTONES -->

        <div class="links">

            <a href="#" class="boton-enlace">
                🎮 Mi videojuego favorito
            </a>

            <a href="#" class="boton-enlace">
                🏆 Mis logros
            </a>

            <a href="#" class="boton-enlace">
                🕹️ Mi partida
            </a>

        </div>

        <!-- MENSAJE -->

        <div class="mensaje">

            🎮 ¡Bienvenido a mi mundo gamer! 🎮

            <br>

            ⚡ Juega • Gana • Diviértete ⚡

            <br>

            🏆 ¡Que comience la partida! 🏆

        </div>

        <!-- DECORACIÓN FINAL -->

        <div class="corazones">
            👾 🎮 ⚡ 🕹️ ⭐ 🎮 👾
        </div>

    </main>

</body>

</html>
